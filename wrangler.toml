# Cloudflare Workers Builds reads this when it runs `npx wrangler deploy`.

name = "shoot-runners"
main = "worker.js"
compatibility_date = "2025-01-01"

# The scores. Declared here rather than attached in the dashboard, because
# `wrangler deploy` replaces a Worker's bindings with whatever this file says
# -- and because the dashboard refuses to attach anything to a Worker it
# considers static-assets-only, which is the wall this kept hitting.
[[kv_namespaces]]
binding = "SCORES"
id = "ca581da8cc934780bbf75e1a551df8f4"

# No [assets] block, deliberately. Serving the game from here as well turned
# this into a Worker Cloudflare classified as static-assets-only, which cannot
# hold a KV binding at all -- the dashboard says so in as many words. The game
# is already served by GitHub Pages; this Worker does one job, the board, and
# sends anyone who opens its address to the game.
