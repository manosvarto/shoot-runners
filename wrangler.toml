# Cloudflare Workers Builds reads this when it runs `npx wrangler deploy`.

name = "shoot-runners"
main = "worker.js"
compatibility_date = "2025-01-01"

# The game itself, served as static files straight from this repo. A request
# for a file that exists is answered from here and never reaches the code
# below; anything under /api/ has no matching file, so it falls through to
# worker.js. One Worker, one address: the game and the leaderboard are the
# same origin, which also means the board needs no cross-origin permission.
[assets]
directory = "."
binding = "ASSETS"

# ── The scores store ──────────────────────────────────────────────────────
# Commented out on purpose. `wrangler deploy` refuses to run with a namespace
# ID it cannot resolve, so leaving a placeholder here means nothing deploys at
# all. With this block absent the build succeeds, the API goes live, and the
# store can be attached from the dashboard — Settings → Bindings → Add → KV
# namespace, variable name SCORES — which is a dropdown and needs no ID.
#
# That binding survives until the next `wrangler deploy`, which replaces a
# Worker's bindings with whatever this file says. So once it is working,
# uncomment this and fill in the real ID (the dashboard shows it in the
# "Update your Wrangler configuration" box once a binding exists):
#
# [[kv_namespaces]]
# binding = "SCORES"
# id = "your-kv-namespace-id"
